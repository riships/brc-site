name: Deploy to OCI (Oracle Cloud Infrastructure)

on:
  workflow_dispatch:
  # Uncomment the lines below if you want automatic deployment on push to main/master:
  # push:
  #   branches: [main, master]

jobs:
  deploy-oci:
    name: Deploy to OCI Compute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to OCI VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'opc' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/brc-site"
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main

            # Build and deploy with docker compose
            chmod +x deploy-oci.sh
            ./deploy-oci.sh
